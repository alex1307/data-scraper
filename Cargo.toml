[package]
name = "data-scraper"
version = "1.0.0"
authors = ["Ayagasha <alexander.todorov@ayagasha.com>"]
edition = "2024"


[dependencies]
headless_chrome = { version = "^1" }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
scraper = "0.24"
encoding_rs = "0.8.35"
futures = "0.3.31"
tokio = { version = "1", features = ["full"] }
regex = "1.11.1"
log = { version = "0.4.27", features = [
    "max_level_info",
    "release_max_level_info",
] }
log4rs = "1.3.0"
lazy_static = "1.5.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9"
serde_ignored = "0.1.11"
csv = "1.3.1"
chrono = "0.4.40"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.15"
mockito = "1.7.0"
async-trait = "0.1.88"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
prost = "^0.14"
rdkafka = { version = "0.38.0", features = ["tokio"], optional = true }
uuid = { version = "1", features = ["v4", "fast-rng", "macro-diagnostics"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
    "bigdecimal",
], optional = true }
dotenvy = "0.15.0"
flate2 = "1.0"
[build-dependencies]
prost-build = "^0.14"
flate2 = "1.0"

[[bin]]
name = "crawler"
path = "src/bin/crawler.rs"
required-features = ["postgres"]

[[bin]]
name = "mobile_de"
path = "src/bin/mobile_de.rs"
required-features = ["postgres", "kafka"]


[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
panic = "abort"
strip = true

[features]
default = []
kafka = ["dep:rdkafka"]
postgres = ["dep:sqlx"]
