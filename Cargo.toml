[package]
name = "data-scraper"
version = "1.0.0"
authors = ["Ayagasha <alexander.todorov@ayagasha.com>"]
edition = "2021"


[build]
target-dir = "/Users/matkat/Software/release/Rust/bin"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
scraper = "0.23.1"
encoding_rs = "0.8"
futures = "0.3"
tokio = { version = "1.41", features = ["full"] }
regex = "1.10"
log = { version = "0.4", features = [
    "max_level_info",
    "release_max_level_info",
] }
log4rs = "1.3"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_ignored = "0.1"
csv = "1.3"
chrono = "0.4"
crossbeam = "0.8"
crossbeam-channel = "0.5"
mockito = "1.4.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
rand = "0.9.0"
prost = "0.13"
rdkafka = { version = "0.37", features = ["tokio"] }
uuid = { version = "1.15", features = ["v4", "fast-rng", "macro-diagnostics"] }

[build-dependencies]
prost-build = "0.13"

[[bin]]
name = "crawler"
path = "src/bin/crawler.rs"


[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
panic = "abort"
strip = true
