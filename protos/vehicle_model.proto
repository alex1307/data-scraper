syntax = "proto3";
package vehicle_model;
option go_package = "internal/proto_model";

message BaseVehicleInfo {
    string id = 1;
    string source = 2;
    string make = 3;
    string model = 4;
    string title = 5;
    string currency = 6;       // Assuming Currency is a defined enum or message
    uint32 price = 7;            // Optional in Rust, so no 'optional' keyword needed in proto3
    uint32 millage = 8;          // Optional in Rust, so no 'optional' keyword needed in proto3
    uint32 month = 9;            // Optional in Rust, so no 'optional' keyword needed in proto3
    uint32 year = 10;
    string engine = 11;          // Assuming Engine is a defined message
    string gearbox = 12;        // Assuming Gearbox is a defined message
    uint32 cc = 13;
    uint32 power_ps = 14;
    uint32 power_kw = 15;
    string search_id = 16;
    string url = 17;
}

message VehicleChangeLogInfo {
    string id = 1;
    string source = 2;
    string published_on = 3;
    string last_modified_on = 4;
    string last_modified_message = 5;
    uint32 days_in_sale = 6;  // Optional in Rust, so no 'optional' keyword needed in proto3
    bool sold = 7;
    bool promoted = 8;
}

message DetailedVehicleInfo {
    string id = 1;
    string source = 2;
    string location = 3;
    string equipment = 4;
    string seller_name = 5;
    string seller_url = 6;
    uint32 range = 7;
    float consumption_fuel = 8;
    float consumption_kw = 9;
    uint32 co2 = 10;
    uint32 days_in_sale = 11;
}

message Price {
    string id = 1;
    string source = 2;
    uint32 estimated_price = 3;  // Optional in Rust, so no 'optional' keyword needed in proto3
    uint32 price = 4;
    string currency = 5;  // Assuming Currency is defined in enums.proto
    uint32 save_difference = 6;
    uint32 overpriced_difference = 7;
    string ranges = 8;  // Optional in Rust, so no 'optional' keyword needed in proto3
    string rating = 9;  // Optional in Rust, so no 'optional' keyword needed in proto3

    // For 'thresholds', protobuf doesn't support Vec directly. You might consider using repeated field.
    repeated uint32 thresholds = 10;
}

message Consumption {
    string id = 1;
    string source = 2;
    string make = 3;
    string model = 4;
    uint32 year = 5;
    uint32 co2_emission = 6;
    float fuel_consumption = 7;  // Optional in Rust, so no 'optional' keyword needed in proto3
    float kw_consuption = 8;     // Optional in Rust, so no 'optional' keyword needed in proto3
}

message ID {
    string id = 1;
    string source = 2;
}

message VehicleView {
    string id = 1;
    string source = 2;
    string make = 3;
    string model = 4;
    string title = 5;
    string currency = 6;       // Assuming Currency is a defined enum or message
    uint32 price = 7;            // Optional in Rust, so no 'optional' keyword needed in proto3
    uint32 millage = 8;          // Optional in Rust, so no 'optional' keyword needed in proto3
    uint32 year = 10;
    string engine = 11;          // Assuming Engine is a defined message
    string gearbox = 12;        // Assuming Gearbox is a defined message
    uint32 cc = 13;
    uint32 power_ps = 14;
    uint32 estimated_price = 15;
    string location = 16;
    string equipment = 17;
    string seller_name = 18;
    uint32 days_in_sale = 19;
    bool promoted = 20;
    string last_modified_on = 21;
}

message DownloadStatus{
    string id = 1;
    string source = 2;
    string url = 3;
    uint32 listed = 4;
    uint32 actual = 5;
    string hash = 6;
}

message EurExchangeRate {
    string currency = 1;
    float eur_exchange_rate = 2;
    string created_on = 3;
}

message VehicleList {
    repeated Vehicle vehicles = 1;
}

message Vehicle {
  string id = 1;
  string source = 2;
  string make = 3;
  string model = 4;
  string title = 5;
  uint32 year = 6;
  uint32 mileage = 7;

  string engine = 8;
  string gearbox = 9;

  uint32 power_ps = 10;
  uint32 power_kw = 11;

  string currency = 12;
  uint32 price = 13;

  uint32 estimated_price = 14;
  uint32 cc = 15;

  string url = 16;
  string location = 17;
  string equipment = 18;

  string seller_name = 19;
  string seller_url = 20;

  uint32 range = 21;
  float consumption_fuel = 22;
  float consumption_kw = 23;
  uint32 co2 = 24;

  uint32 days_in_sale = 25;
  string ranges = 26;
  string rating = 27;

  repeated uint32 thresholds = 31;
}

